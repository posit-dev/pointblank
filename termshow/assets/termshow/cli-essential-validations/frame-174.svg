<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040.0 788.0" width="1040.0" height="788.0" role="img" aria-label="Terminal recording frame">
<style>.gd-tp-text{font-family:JetBrains Mono, Fira Code, SF Mono, Menlo, Consolas, monospace;font-size:14px;white-space:pre;dominant-baseline:text-before-edge}.gd-tp-bold{font-weight:700}.gd-tp-italic{font-style:italic}.gd-tp-underline{text-decoration:underline}.gd-tp-strikethrough{text-decoration:line-through}.gd-tp-dim{opacity:0.6}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.gd-tp-cursor{animation:blink 1s step-end infinite}</style>
<rect width="1040.0" height="788.0" fill="#282a36" rx="8" ry="8"/>
<g transform="translate(16,16)">
<text x="0.0" y="0.0" class="gd-tp-text" fill="#f8f8f2">&gt; # Essential Data Validation with Pointblank CLI</text>
<text x="0.0" y="21.0" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="42.0" class="gd-tp-text" fill="#f8f8f2">&gt; # 1. Get the table dimensions, just to know what you're working with</text>
<text x="0.0" y="63.0" class="gd-tp-text" fill="#f8f8f2">&gt; pb info small_table</text>
<text x="0.0" y="105.0" class="gd-tp-text gd-tp-bold" fill="#a4ffff">Data Source Information</text>
<text x="0.0" y="147.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="147.0" class="gd-tp-text gd-tp-bold" fill="#ff92df"> Property   </text>
<text x="109.2" y="147.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="117.6" y="147.0" class="gd-tp-text gd-tp-bold" fill="#ff92df"> Value</text>
<text x="0.0" y="168.0" class="gd-tp-text" fill="#f8f8f2"> ──────────────────────────</text>
<text x="0.0" y="189.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="189.0" class="gd-tp-text" fill="#8be9fd"> Source     </text>
<text x="109.2" y="189.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="117.6" y="189.0" class="gd-tp-text" fill="#50fa7b"> small_table</text>
<text x="0.0" y="210.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="210.0" class="gd-tp-text" fill="#8be9fd"> Table Type </text>
<text x="109.2" y="210.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="117.6" y="210.0" class="gd-tp-text" fill="#50fa7b"> polars</text>
<text x="0.0" y="231.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="231.0" class="gd-tp-text" fill="#8be9fd"> Rows       </text>
<text x="109.2" y="231.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="117.6" y="231.0" class="gd-tp-text" fill="#50fa7b"> 13</text>
<text x="0.0" y="252.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="252.0" class="gd-tp-text" fill="#8be9fd"> Columns    </text>
<text x="109.2" y="252.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="117.6" y="252.0" class="gd-tp-text" fill="#50fa7b"> 8</text>
<text x="0.0" y="294.0" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="315.0" class="gd-tp-text" fill="#f8f8f2">&gt; # 2. Check for duplicate rows</text>
<rect x="260.4" y="315.0" width="8.4" height="21.0" fill="#f8f8f2" opacity="0.7" class="gd-tp-cursor"/>
</g>
</svg>