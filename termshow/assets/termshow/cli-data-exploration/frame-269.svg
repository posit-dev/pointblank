<text x="109.2" y="189.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="117.6" y="189.0" class="gd-tp-text" fill="#50fa7b"> polars</text>
<text x="0.0" y="207.9" class="gd-tp-text" fill="#f8f8f2"> </text>
