<text x="0.0" y="283.5" class="gd-tp-text" fill="#f8f8f2">&gt; # 2. Get a quick data preview to see structure and sample rows</text>
<text x="0.0" y="302.4" class="gd-tp-text" fill="#f8f8f2">&gt; pb preview worldcities.csv --head 3 --tail 3</text>
