<text x="0.0" y="37.8" class="gd-tp-text" fill="#f8f8f2">&gt; # 1. Ensure that data can be loaded and see some info about the dataset</text>
<text x="0.0" y="56.7" class="gd-tp-text" fill="#f8f8f2">&gt; pb info worldcities.csv</text>
