<text x="0.0" y="0.0" class="gd-tp-text" fill="#f8f8f2">                        for validation.</text>
<text x="0.0" y="21.0" class="gd-tp-text" fill="#f8f8f2">  --set TEXT            Comma-separated allowed values for col-vals-in-set</text>
<text x="0.0" y="42.0" class="gd-tp-text" fill="#f8f8f2">                        checks.</text>
<text x="0.0" y="63.0" class="gd-tp-text" fill="#f8f8f2">  --value FLOAT         Numeric value for comparison checks.</text>
<text x="0.0" y="84.0" class="gd-tp-text" fill="#f8f8f2">  --show-extract        Show extract of failing rows if validation fails</text>
<text x="0.0" y="105.0" class="gd-tp-text" fill="#f8f8f2">  --write-extract TEXT  Save failing rows to folder. Provide base name for</text>
<text x="0.0" y="126.0" class="gd-tp-text" fill="#f8f8f2">                        folder.</text>
<text x="0.0" y="147.0" class="gd-tp-text" fill="#f8f8f2">  --limit INTEGER       Maximum number of failing rows to save to CSV</text>
<text x="0.0" y="168.0" class="gd-tp-text" fill="#f8f8f2">                        (default: 500)</text>
<text x="0.0" y="189.0" class="gd-tp-text" fill="#f8f8f2">  --exit-code           Exit with non-zero code if validation fails</text>
<text x="0.0" y="210.0" class="gd-tp-text" fill="#f8f8f2">  --help                Show this message and exit.</text>
<text x="0.0" y="231.0" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="252.0" class="gd-tp-text" fill="#f8f8f2">&gt; # Your first validation: check for duplicates with rows-distinct</text>
<text x="0.0" y="273.0" class="gd-tp-text" fill="#f8f8f2">&gt; pb validate small_table --check rows-distinct</text>
