<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040.0 712.4" width="1040.0" height="712.4" role="img" aria-label="Terminal recording frame">
<style>.gd-tp-text{font-family:JetBrains Mono, Fira Code, SF Mono, Menlo, Consolas, monospace;font-size:14px;white-space:pre;dominant-baseline:text-before-edge}.gd-tp-bold{font-weight:700}.gd-tp-italic{font-style:italic}.gd-tp-underline{text-decoration:underline}.gd-tp-strikethrough{text-decoration:line-through}.gd-tp-dim{opacity:0.6}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.gd-tp-cursor{animation:blink 1s step-end infinite}</style>
<rect width="1040.0" height="712.4" fill="#282a36" rx="8" ry="8"/>
<g transform="translate(16,16)">
<text x="0.0" y="18.9" class="gd-tp-text" fill="#f8f8f2">Options:</text>
<text x="0.0" y="37.8" class="gd-tp-text" fill="#f8f8f2">  -v, --version  Show the version and exit.</text>
<text x="0.0" y="56.7" class="gd-tp-text" fill="#f8f8f2">  -h, --help     Show this message and exit.</text>
<text x="0.0" y="94.5" class="gd-tp-text" fill="#f8f8f2">Commands:</text>
<text x="0.0" y="113.4" class="gd-tp-text" fill="#f8f8f2">  info           Display information about a data source.</text>
<text x="0.0" y="132.3" class="gd-tp-text" fill="#f8f8f2">  preview        Preview a data table showing head and tail rows.</text>
<text x="0.0" y="151.2" class="gd-tp-text" fill="#f8f8f2">  scan           Generate a data scan profile report.</text>
<text x="0.0" y="170.1" class="gd-tp-text" fill="#f8f8f2">  missing        Generate a missing values report for a data table.</text>
<text x="0.0" y="189.0" class="gd-tp-text" fill="#f8f8f2">  validate       Perform single or multiple data validations.</text>
<text x="0.0" y="207.9" class="gd-tp-text" fill="#f8f8f2">  run            Run a Pointblank validation script or YAML configuration.</text>
<text x="0.0" y="226.8" class="gd-tp-text" fill="#f8f8f2">  compare        Compare two tables row by row.</text>
<text x="0.0" y="245.7" class="gd-tp-text" fill="#f8f8f2">  make-template  Create a validation script or YAML configuration template.</text>
<text x="0.0" y="264.6" class="gd-tp-text" fill="#f8f8f2">  pl             Execute Polars expressions and display results.</text>
<text x="0.0" y="283.5" class="gd-tp-text" fill="#f8f8f2">  datasets       List available built-in datasets.</text>
<text x="0.0" y="302.4" class="gd-tp-text" fill="#f8f8f2">  requirements   Check installed dependencies and their availability.</text>
<text x="0.0" y="321.3" class="gd-tp-text" fill="#f8f8f2">  edit           Edit an existing validation plan with a natural-language...</text>
<text x="0.0" y="340.2" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="359.1" class="gd-tp-text" fill="#f8f8f2">&gt; # There are a number of datasets you can use for testing</text>
<text x="0.0" y="378.0" class="gd-tp-text" fill="#f8f8f2">&gt; pb datasets</text>
<text x="0.0" y="396.9" class="gd-tp-text gd-tp-bold" fill="#a4ffff">Available Pointblank Datasets</text>
<text x="0.0" y="434.7" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="434.7" class="gd-tp-text gd-tp-bold" fill="#ff92df"> Dataset Name </text>
<text x="126.0" y="434.7" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="134.4" y="434.7" class="gd-tp-text gd-tp-bold" fill="#ff92df"> Dimensions                </text>
<text x="361.2" y="434.7" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="369.6" y="434.7" class="gd-tp-text gd-tp-bold" fill="#ff92df"> Description</text>
<text x="0.0" y="453.6" class="gd-tp-text" fill="#f8f8f2"> ──────────────────────────────────────────────────────────────────────────────────</text>
<text x="0.0" y="472.5" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="472.5" class="gd-tp-text" fill="#8be9fd"> small_table  </text>
<text x="126.0" y="472.5" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="134.4" y="472.5" class="gd-tp-text" fill="#50fa7b"> 13 rows × 8 columns       </text>
<text x="361.2" y="472.5" class="gd-tp-text" fill="#f8f8f2">  Small demo dataset for testing</text>
<text x="0.0" y="491.4" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="491.4" class="gd-tp-text" fill="#8be9fd"> game_revenue </text>
<text x="126.0" y="491.4" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="134.4" y="491.4" class="gd-tp-text" fill="#50fa7b"> 2,000 rows × 11 columns   </text>
<text x="361.2" y="491.4" class="gd-tp-text" fill="#f8f8f2">  Game development company revenue data</text>
<text x="0.0" y="510.3" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="510.3" class="gd-tp-text" fill="#8be9fd"> nycflights   </text>
<text x="126.0" y="510.3" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="134.4" y="510.3" class="gd-tp-text" fill="#50fa7b"> 336,776 rows × 18 columns </text>
<text x="361.2" y="510.3" class="gd-tp-text" fill="#f8f8f2">  NYC airport flights data from 2013</text>
<text x="0.0" y="529.2" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="8.4" y="529.2" class="gd-tp-text" fill="#8be9fd"> global_sales </text>
<text x="126.0" y="529.2" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="134.4" y="529.2" class="gd-tp-text" fill="#50fa7b"> 50,000 rows × 20 columns  </text>
<text x="361.2" y="529.2" class="gd-tp-text" fill="#f8f8f2">  Global sales data across regions</text>
<text x="0.0" y="585.9" class="gd-tp-text gd-tp-dim" fill="#f8f8f2">Use these dataset names directly with any pb CLI command.</text>
<text x="0.0" y="604.8" class="gd-tp-text gd-tp-dim" fill="#f8f8f2">Example: pb preview small_table</text>
<text x="0.0" y="623.7" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="642.6" class="gd-tp-text" fill="#f8f8f2">&gt; # Learn about all the `pb validate` options</text>
<text x="0.0" y="661.5" class="gd-tp-text" fill="#f8f8f2">&gt; pb va</text>
<rect x="58.8" y="661.5" width="8.4" height="18.9" fill="#f8f8f2" opacity="0.7" class="gd-tp-cursor"/>
</g>
</svg>