<text x="8.4" y="420.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="16.8" y="420.0" class="gd-tp-text" fill="#50fa7b">✓ Validation PASSED: All values in column 'latitude' are &lt;= 90.0 in worldcities.csv</text>
<text x="714.0" y="420.0" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="722.4" y="420.0" class="gd-tp-text" fill="#50fa7b">│</text>
<text x="0.0" y="441.0" class="gd-tp-text" fill="#50fa7b">╰─────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="0.0" y="462.0" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="483.0" class="gd-tp-text" fill="#f8f8f2">&gt; # Step 6: Create a comprehensive validation script for production use</text>
<text x="0.0" y="504.0" class="gd-tp-text" fill="#f8f8f2">&gt; cat validation.py</text>
<text x="0.0" y="525.0" class="gd-tp-text" fill="#f8f8f2">import pointblank as pb</text>
<text x="0.0" y="567.0" class="gd-tp-text" fill="#f8f8f2">validation = (</text>
<text x="0.0" y="588.0" class="gd-tp-text" fill="#f8f8f2">    pb.Validate(</text>
<text x="0.0" y="609.0" class="gd-tp-text" fill="#f8f8f2">        data="worldcities.csv",</text>
<text x="0.0" y="630.0" class="gd-tp-text" fill="#f8f8f2">        thresholds=pb.Thresholds(</text>
<text x="0.0" y="651.0" class="gd-tp-text" fill="#f8f8f2">            warning=1,  # 1 failure</text>
<text x="0.0" y="672.0" class="gd-tp-text" fill="#f8f8f2">            error=0.05,  # 5% of rows failing</text>
<text x="0.0" y="693.0" class="gd-tp-text" fill="#f8f8f2">        ),</text>
<text x="0.0" y="714.0" class="gd-tp-text" fill="#f8f8f2">    )</text>
<text x="0.0" y="735.0" class="gd-tp-text" fill="#f8f8f2">    .col_schema_match(</text>
<text x="0.0" y="756.0" class="gd-tp-text" fill="#f8f8f2">        schema=pb.Schema(</text>
<text x="0.0" y="777.0" class="gd-tp-text" fill="#f8f8f2">            columns=[</text>
<text x="0.0" y="798.0" class="gd-tp-text" fill="#f8f8f2">                ("city_name", "String"),</text>
<text x="0.0" y="819.0" class="gd-tp-text" fill="#f8f8f2">                ("latitude", "Float64"),</text>
<text x="0.0" y="840.0" class="gd-tp-text" fill="#f8f8f2">                ("longitude", "Float64"),</text>
<text x="0.0" y="861.0" class="gd-tp-text" fill="#f8f8f2">                ("country", "String"),</text>
<text x="0.0" y="882.0" class="gd-tp-text" fill="#f8f8f2">                ("population", "Int64"),</text>
<text x="0.0" y="903.0" class="gd-tp-text" fill="#f8f8f2">            ]</text>
<text x="0.0" y="924.0" class="gd-tp-text" fill="#f8f8f2">        ),</text>
<text x="0.0" y="945.0" class="gd-tp-text" fill="#f8f8f2">    )</text>
<text x="0.0" y="966.0" class="gd-tp-text" fill="#f8f8f2">    .col_vals_not_null(columns="city_name")</text>
<text x="0.0" y="987.0" class="gd-tp-text" fill="#f8f8f2">    .col_vals_not_null(columns="population")</text>
<text x="0.0" y="1008.0" class="gd-tp-text" fill="#f8f8f2">    .col_vals_gt(columns="population", value=0, na_pass=True)</text>
<text x="0.0" y="1029.0" class="gd-tp-text" fill="#f8f8f2">    .col_vals_between(columns="latitude", left=-90, right=90)</text>
<text x="0.0" y="1050.0" class="gd-tp-text" fill="#f8f8f2">    .col_vals_between(columns="longitude", left=-180, right=180)</text>
<text x="0.0" y="1071.0" class="gd-tp-text" fill="#f8f8f2">    .interrogate()</text>
<text x="0.0" y="1092.0" class="gd-tp-text" fill="#f8f8f2">)</text>
<text x="0.0" y="1113.0" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="1134.0" class="gd-tp-text" fill="#f8f8f2">&gt; # Step 7: Run that comprehensive validation and get a validation reporting table</text>
<text x="0.0" y="1155.0" class="gd-tp-text" fill="#f8f8f2">&gt; pb r</text>
<rect x="50.4" y="1155.0" width="8.4" height="21.0" fill="#f8f8f2" opacity="0.7" class="gd-tp-cursor"/>
</g>
