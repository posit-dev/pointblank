<text x="16.8" y="396.9" class="gd-tp-text" fill="#50fa7b">✓ Validation PASSED: All values in column 'latitude' are &lt;= 90.0 in worldcities.csv</text>
<text x="714.0" y="396.9" class="gd-tp-text" fill="#f8f8f2"> </text>
<text x="722.4" y="396.9" class="gd-tp-text" fill="#50fa7b">│</text>
<text x="0.0" y="415.8" class="gd-tp-text" fill="#50fa7b">╰─────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="0.0" y="434.7" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="453.6" class="gd-tp-text" fill="#f8f8f2">&gt; # Step 6: Create a comprehensive validation script for production use</text>
<text x="0.0" y="472.5" class="gd-tp-text" fill="#f8f8f2">&gt; cat validation.py</text>
<text x="0.0" y="491.4" class="gd-tp-text" fill="#f8f8f2">import pointblank as pb</text>
<text x="0.0" y="529.2" class="gd-tp-text" fill="#f8f8f2">validation = (</text>
<text x="0.0" y="548.1" class="gd-tp-text" fill="#f8f8f2">    pb.Validate(</text>
<text x="0.0" y="567.0" class="gd-tp-text" fill="#f8f8f2">        data="worldcities.csv",</text>
<text x="0.0" y="585.9" class="gd-tp-text" fill="#f8f8f2">        thresholds=pb.Thresholds(</text>
<text x="0.0" y="604.8" class="gd-tp-text" fill="#f8f8f2">            warning=1,  # 1 failure</text>
<text x="0.0" y="623.7" class="gd-tp-text" fill="#f8f8f2">            error=0.05,  # 5% of rows failing</text>
<text x="0.0" y="642.6" class="gd-tp-text" fill="#f8f8f2">        ),</text>
<text x="0.0" y="661.5" class="gd-tp-text" fill="#f8f8f2">    )</text>
<text x="0.0" y="680.4" class="gd-tp-text" fill="#f8f8f2">    .col_schema_match(</text>
<text x="0.0" y="699.3" class="gd-tp-text" fill="#f8f8f2">        schema=pb.Schema(</text>
<text x="0.0" y="718.2" class="gd-tp-text" fill="#f8f8f2">            columns=[</text>
<text x="0.0" y="737.1" class="gd-tp-text" fill="#f8f8f2">                ("city_name", "String"),</text>
<text x="0.0" y="756.0" class="gd-tp-text" fill="#f8f8f2">                ("latitude", "Float64"),</text>
<text x="0.0" y="774.9" class="gd-tp-text" fill="#f8f8f2">                ("longitude", "Float64"),</text>
<text x="0.0" y="793.8" class="gd-tp-text" fill="#f8f8f2">                ("country", "String"),</text>
<text x="0.0" y="812.7" class="gd-tp-text" fill="#f8f8f2">                ("population", "Int64"),</text>
<text x="0.0" y="831.6" class="gd-tp-text" fill="#f8f8f2">            ]</text>
<text x="0.0" y="850.5" class="gd-tp-text" fill="#f8f8f2">        ),</text>
<text x="0.0" y="869.4" class="gd-tp-text" fill="#f8f8f2">    )</text>
<text x="0.0" y="888.3" class="gd-tp-text" fill="#f8f8f2">    .col_vals_not_null(columns="city_name")</text>
<text x="0.0" y="907.2" class="gd-tp-text" fill="#f8f8f2">    .col_vals_not_null(columns="population")</text>
<text x="0.0" y="926.1" class="gd-tp-text" fill="#f8f8f2">    .col_vals_gt(columns="population", value=0, na_pass=True)</text>
<text x="0.0" y="945.0" class="gd-tp-text" fill="#f8f8f2">    .col_vals_between(columns="latitude", left=-90, right=90)</text>
<text x="0.0" y="963.9" class="gd-tp-text" fill="#f8f8f2">    .col_vals_between(columns="longitude", left=-180, right=180)</text>
<text x="0.0" y="982.8" class="gd-tp-text" fill="#f8f8f2">    .interrogate()</text>
<text x="0.0" y="1001.7" class="gd-tp-text" fill="#f8f8f2">)</text>
<text x="0.0" y="1020.6" class="gd-tp-text" fill="#f8f8f2">&gt;</text>
<text x="0.0" y="1039.5" class="gd-tp-text" fill="#f8f8f2">&gt; # Step 7: Run that comprehen</text>
