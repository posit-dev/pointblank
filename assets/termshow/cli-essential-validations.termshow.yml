# Converted from cli-essential-validations.tape (VHS) with `great-docs termshow import-tape`, then adjusted:
# commands are `run:` steps, which wait for the prompt.
# Record it (with `pb` on the PATH) with:
#   great-docs termshow record --steps assets/termshow/cli-essential-validations.termshow.yml

settings:
  theme: dracula
  window_chrome: colorful
record:
  shell: bash --noprofile --norc
  cols: 120
  rows: 36
  cwd: demo
  env:
    PS1: '> '
  prompt_pattern: '> $'
steps:
- run: '# Essential Data Validation with Pointblank CLI'
- sleep: 2
- run: ''
- run: '# 1. Get the table dimensions, just to know what you''re working with'
- run: pb info small_table
  timeout: 60
- sleep: 4
- run: ''
- run: '# 2. Check for duplicate rows (the most common data quality issue)'
- run: pb validate small_table --check rows-distinct
  timeout: 60
- sleep: 4
- run: ''
- run: '# 3. Find missing values in important columns'
- run: pb validate small_table --check col-vals-not-null --column c
  timeout: 60
- sleep: 4
- run: ''
- run: '# 4. When validation fails, see exactly which rows are problematic with --show-extract'
- run: pb validate small_table --check col-vals-not-null --column c --show-extract
  timeout: 60
- sleep: 5
- run: ''
- run: '# That is just a sampling of the essentials with duplicates, nulls, with data extracts'
- sleep: 2
