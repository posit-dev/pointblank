# Converted from cli-data-exploration.tape (VHS) with `great-docs termshow import-tape`, then adjusted:
# commands are `run:` steps, which wait for the prompt, and the data is written out
# (hidden), then removed when the shell exits.
# Record it (with `pb` on the PATH) with:
#   great-docs termshow record --steps assets/termshow/cli-data-exploration.termshow.yml

settings:
  theme: dracula
  window_chrome: colorful
record:
  shell: bash --noprofile --norc
  cols: 125
  rows: 42
  cwd: demo
  env:
    PS1: '> '
  prompt_pattern: '> $'
steps:
- hide
# data_raw/worldcities.csv writes 39 populations as 108860.00 or 50.789, which makes
# pl.read_csv() fail; this writes them as integers, giving the original file back
- run: >-
    perl -pe 's/,(\d+)\.00(\r?)$/,$1$2/; s/,(\d+)\.(\d{3})(\r?)$/,$1$2$3/'
    ../../../data_raw/worldcities.csv > worldcities.csv &&
    trap 'rm -f worldcities.csv validation_report.html' EXIT
- run: clear
- show
- run: '# Data Exploration & Profiling with the Pointblank CLI'
- sleep: 2
- run: ''
- run: '# 1. Ensure that data can be loaded and see some info about the dataset'
- run: pb info worldcities.csv
  timeout: 60
- sleep: 2
- run: ''
- run: '# 2. Get a quick data preview to see structure and sample rows'
- run: pb preview worldcities.csv --head 3 --tail 3
  timeout: 60
- sleep: 4
- run: ''
- run: '# 3. Missing values analysis: identify data gaps'
- run: pb missing worldcities.csv
  timeout: 60
- sleep: 4
- run: ''
- run: '# 4. Comprehensive data scan: statistical overview'
- run: pb scan worldcities.csv
  timeout: 60
- sleep: 5
- run: ''
- run: '# That''s data profiling in seconds with the Pointblank CLI'
- sleep: 2
